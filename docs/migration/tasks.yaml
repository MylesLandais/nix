# Task contracts for the dendritic migration. Format: docs/migration/README.md.
# Phase 2's per-module tasks (M-2xx) are generated from `migration inventory`
# by M-103 and appended below.
tasks:
  # ---------------------------------------------------------------- Phase 0
  - id: M-001
    title: Create the migration branch and the Vault journal
    phase: 0
    depends_on: []
    policy: pure_refactor
    hosts: []
  - id: M-002
    title: Add the migration harness and docs/migration
    phase: 0
    depends_on: [M-001]
    policy: contract_change
    hosts: [kali-vm]
    contract:
      - packages/x86_64-linux/migration
      - apps/x86_64-linux/migration
    touches: [modules/flake/migration.nix, scripts/migration/*, docs/migration/*, .gitignore]
    resources: {reads: [], writes: [flake.outputs]}
  - id: M-003
    title: Capture the baseline, write registry.json, tag migration/baseline
    phase: 0
    depends_on: [M-002]
    policy: pure_refactor
    hosts: [all]
    touches: [docs/migration/baseline/*, docs/migration/registry.json]

  # ---------------------------------------------------------------- Phase 1
  - id: M-101
    title: Move modules/flake-parts/* to modules/flake/
    phase: 1
    depends_on: [M-003]
    policy: pure_refactor
    hosts: [all]
    touches: [modules/flake-parts/*, modules/flake/*, modules/hosts/*/default.nix, colmena.nix]
    resources: {reads: [flake.outputs], writes: [flake.outputs]}
    # stage-edge/stage-db default.nix import the mkHost helper by path; the
    # one-line path update is the only edit allowed under frozen paths.
    allow_frozen: true
  - id: M-102
    title: Fold the flake.nix `base // {…}` shim into flake-parts modules
    phase: 1
    depends_on: [M-101]
    policy: pure_refactor
    hosts: [cerberus]
    touches: [flake.nix, modules/flake/*]
    # colmena.nix's import moves from flake.nix (outside the scan) into
    # modules/flake/outputs.nix: the same import, newly counted.
    path_imports_allow: 1
    resources: {reads: [flake.outputs], writes: [flake.outputs]}
  - id: M-103
    title: Generate the Phase 2 conversion tasks from `migration inventory` (done; see Phase 2)
    phase: 1
    depends_on: [M-102]
    policy: pure_refactor
    hosts: []
    touches: [docs/migration/tasks.yaml]
  - id: M-104
    title: Add checks.module-registry and document the naming convention
    phase: 1
    depends_on: [M-103]
    policy: contract_change
    hosts: []
    contract: [checks/x86_64-linux/module-registry]
    touches: [modules/flake/module-registry.nix, docs/migration/README.md]
    resources: {reads: [registry.nixos, registry.homeManager], writes: [flake.outputs]}

  # ---------------------------------------------------------------- Phase 2
  # Generated by M-103 from `migration inventory` (docs/migration/inventory.json).
  # Each task: move the module(s) into modules/{nixos,home}/ as explicit
  # flake.modules.<class>.<name> definitions, keep sub-files private (`_x.nix`)
  # inside the feature's own directory, and switch every import site to the
  # registry. Import order is preserved (it fixes list-merge order).
  # Dead modules are deleted, not converted (M-501 runs before M-209).
  # Order: leaf HM features first (M-203..M-212, each switching _home.nix's
  # import to the registry), then the HM base itself (M-202), so no
  # temporary ../ path imports appear.
  - id: M-201
    title: "Collapse NixOS wrapper pairs (agenix, chromium-policy, dev, gaming, nvidia) into single-file flake modules"
    phase: 2
    depends_on: [M-104]
    policy: pure_refactor
    hosts: [cerberus]
    registry: {add: [nixos.agenixHost, nixos.chromiumPolicy, nixos.dev, nixos.gaming, nixos.nvidia]}
    touches: ["modules/_{agenix,chromium-policy,dev,gaming,nvidia}.nix, modules/{agenix,chromium-policy,dev,gaming,nvidia}.nix, modules/nixos/*"]
  - id: M-202
    title: "homeManager.base: move _home.nix (+ _packages, _chatgpt-linux, eurostile) to modules/home/base/; hosts import the registry module"
    phase: 2
    depends_on: [M-212]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.base]}
    touches: ["modules/_home.nix, modules/home-export.nix, modules/_packages.nix, modules/_chatgpt-linux.nix, modules/fonts/*, modules/home/base/*, modules/hosts/_deploy-nodes.nix, modules/hosts/cerberus/default.nix"]
  - id: M-203
    title: "Expose the chromium flag helpers as flake.lib.chromiumBrowsers (used by HM base and cerberus)"
    phase: 2
    depends_on: [M-201]
    policy: contract_change
    hosts: [cerberus, lacie, kali-vm]
    contract: ["lib/*"]
    touches: ["modules/_chromium-browsers.nix, modules/flake/lib.nix"]
  - id: M-204
    title: "homeManager.firefox: inline _firefox.nix into the registry module; base imports it from the registry"
    phase: 2
    depends_on: [M-203]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.firefox]}
    touches: ["modules/_firefox.nix, modules/firefox.nix, modules/home/firefox.nix"]
  - id: M-205
    title: "homeManager.shelltools (+ atuin, bat, direnv, eza, fish, fzf, yazi, zoxide, zsh as private files)"
    phase: 2
    depends_on: [M-204]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.shelltools]}
    touches: ["modules/_features/shelltools/*, modules/home/shelltools/*"]
  - id: M-206
    title: "homeManager.devtooling (+ git, gleam, go, kubernetes, lua, pi, remmina, rust, tmux, zed); 7PZSZY2 imports it from the registry"
    phase: 2
    depends_on: [M-205]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm, 7PZSZY2]
    registry: {add: [homeManager.devtooling]}
    touches: ["modules/_features/devtooling/*, modules/home/devtooling/*, modules/hosts/7PZSZY2/default.nix"]
  - id: M-207
    title: "homeManager.terminals, homeManager.prompt (starship/kanagawa), homeManager.gtk, homeManager.mpv, homeManager.stylix"
    phase: 2
    depends_on: [M-206]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.terminals, homeManager.prompt, homeManager.gtk, homeManager.mpv, homeManager.stylix]}
    touches: ["modules/_features/{terminals,prompt,gtk,mpv,stylix}/*, modules/home/*"]
  - id: M-208
    title: "homeManager.hyprland, homeManager.niri, homeManager.xfce (HM halves of the desktops)"
    phase: 2
    depends_on: [M-207]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.hyprland, homeManager.niri, homeManager.xfce]}
    touches: ["modules/_features/desktops/*/{default,hypr,hyprlock,hyprpaper,wlogout,workspace-recovery,prompt-follow-focus,niri}.nix, modules/_features/desktops/hyprland/config/*, modules/home/{hyprland,niri,xfce}/*"]
  - id: M-209
    title: "homeManager.bars (noctalia only; dead bars are gone after M-501)"
    phase: 2
    depends_on: [M-208, M-501]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.bars]}
    touches: ["modules/_features/bars/*, modules/home/bars/*"]
  - id: M-210
    title: "Single HM features: appWrappers, chromiumHeliumPrefs, cargoTargetSweep, diskPlaybook, flameshot, nixUserGc, sshBitwarden, hermes"
    phase: 2
    depends_on: [M-209]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [homeManager.appWrappers, homeManager.chromiumHeliumPrefs, homeManager.cargoTargetSweep, homeManager.diskPlaybook, homeManager.flameshot, homeManager.nixUserGc, homeManager.sshBitwarden, homeManager.hermes]}
    touches: ["modules/_features/{app-wrappers,chromium-helium-prefs,cargo-target-sweep,disk-playbook,flameshot,nix-user-gc,ssh-bitwarden}.nix, modules/_hermes.nix, modules/home/*"]
  - id: M-211
    title: "Cerberus-only HM features: blenderMcp, hermesDesktop, hydraSmb, penpotMcp, workspaceBudget (HM half)"
    phase: 2
    depends_on: [M-210]
    policy: pure_refactor
    hosts: [cerberus]
    registry: {add: [homeManager.blenderMcp, homeManager.hermesDesktop, homeManager.hydraSmb, homeManager.penpotMcp, homeManager.workspaceBudget]}
    touches: ["modules/_features/{blender-mcp,hermes-desktop,hydra-smb,penpot-mcp,workspace-budget-home}.nix, modules/home/*, modules/hosts/cerberus/_home.nix"]
  - id: M-212
    title: "homeManager.server (profiles/_server-home.nix) for the Dell cluster"
    phase: 2
    depends_on: [M-211]
    policy: pure_refactor
    hosts: [argus, 94tl0m2, 95qmom2]
    registry: {add: [homeManager.server]}
    touches: ["modules/profiles/_server-home.nix, modules/home/server.nix, modules/hosts/_deploy-nodes.nix"]
  - id: M-213
    title: "Baseline NixOS modules: hostOptions, nixConfig, fishConfig, overlays, envPackages; mkHost baseline uses the registry"
    phase: 2
    depends_on: [M-202]
    policy: pure_refactor
    hosts: [all]
    registry: {add: [nixos.hostOptions, nixos.nixConfig, nixos.fishConfig, nixos.overlays, nixos.envPackages, nixos.chaotic]}
    touches: ["modules/_features/{host-options,nix-config,fish-config,overlays,env-packages}.nix, modules/_features/overlays/*, modules/nixos/*, modules/flake/_mk-host.nix, modules/hosts/7PZSZY2/default.nix"]
  - id: M-214
    title: "nixos.sshKeys (9 importers, incl. the frozen _oci-common.nix and the installer)"
    phase: 2
    depends_on: [M-213]
    policy: pure_refactor
    hosts: [all]
    registry: {add: [nixos.sshKeys]}
    touches: ["modules/_features/ssh-keys.nix, modules/nixos/ssh-keys.nix, modules/hosts/*"]
    # _oci-common.nix imports ssh-keys by path; switching that one import to
    # the registry is the only frozen-path edit.
    allow_frozen: true
  - id: M-215
    title: "Cerberus NixOS features: audio, fhsCompat, fileSharing, firefoxPolicy, gpuUnlock, hardwareTuning, pokeforce, security, sunshine, syncthing, users, waydroidFeh, workspaceBudget"
    phase: 2
    depends_on: [M-214]
    policy: pure_refactor
    hosts: [cerberus]
    registry: {add: [nixos.audio, nixos.fhsCompat, nixos.fileSharing, nixos.firefoxPolicy, nixos.gpuUnlock, nixos.hardwareTuning, nixos.pokeforce, nixos.security, nixos.sunshine, nixos.syncthing, nixos.users, nixos.waydroidFeh, nixos.workspaceBudget]}
    touches: ["modules/_features/{audio,fhs-compat,file-sharing,firefox-policy,gpu-unlock,hardware-tuning,pokeforce,security,sunshine,syncthing,users,waydroid-feh,workspace-budget}.nix, modules/nixos/*, modules/hosts/cerberus/configuration.nix"]
  - id: M-216
    title: "NixOS desktop halves (hyprland, niri, xfce, kali) under nixos.desktops; move desktops/themeData/greeter/imaging/wifiProfiles out of services/"
    phase: 2
    depends_on: [M-215]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
    registry: {add: [nixos.hyprland, nixos.niri, nixos.xfce, nixos.kali]}
    touches: ["modules/_features/desktops/*/system.nix, modules/_features/kali/*, modules/services/{desktops,theme-data,greeter,imaging,wifi-profiles}.nix, modules/nixos/*"]
  - id: M-217
    title: "Gaming/emulation helpers: gamehacking, citra-agent, scbw packages, battlenet-game helper as private files of their consumers"
    phase: 2
    depends_on: [M-216]
    policy: pure_refactor
    hosts: [cerberus, lacie]
    touches: ["modules/_features/{gamehacking,scbw}/*, modules/_features/{citra-agent,battlenet-game}.nix, modules/services/{gamehacking,scbw}.nix, modules/nixos/*"]
  - id: M-218
    title: "nixos.wslAgent for 7PZSZY2"
    phase: 2
    depends_on: [M-217]
    policy: pure_refactor
    hosts: [7PZSZY2]
    registry: {add: [nixos.wslAgent]}
    touches: ["modules/_features/wsl-agent.nix, modules/nixos/wsl-agent.nix, modules/hosts/7PZSZY2/default.nix"]
  - id: M-220
    title: "Namespace HM options under my.*, drop redundant toggles (rule in plan), add option descriptions, mkIf c true -> c"
    phase: 2
    depends_on: [M-218]
    policy: pure_refactor
    hosts: [all]
    touches: ["modules/home/**, modules/nixos/**, modules/hosts/**"]

  # ---------------------------------------------------------------- Phase 3
  - id: M-301
    title: Table-driven modules/hosts/default.nix; migrate kali-vm
    phase: 3
    depends_on: [CHECKPOINT-2]
    policy: pure_refactor
    hosts: [kali-vm]
    resources: {reads: [host.kali-vm], writes: [host.kali-vm]}
  - id: M-302
    title: Migrate lacie, then argus, to the host table
    phase: 3
    depends_on: [M-301]
    policy: pure_refactor
    hosts: [lacie, argus]
  - id: M-303
    title: Migrate 94tl0m2/95qmom2; shared Dell 7050 bodies as flake.lib.dell7050 (shared behavior only)
    phase: 3
    depends_on: [M-302]
    # flake.lib.dell7050 is a new output; module names (tl0m2, qmom2, …Postgres,
    # …Seaweedfs) are unchanged. A function library instead of an option-driven
    # nixos.dell7050Node keeps every per-host value explicit at the call site.
    policy: contract_change
    contract: ["lib/*"]
    hosts: [94tl0m2, 95qmom2]
  - id: M-304
    title: Move 7PZSZY2 onto mkHost (nixos-wsl nixpkgs); drop the hand-rolled HM config
    phase: 3
    depends_on: [M-301]
    policy: pure_refactor
    hosts: [7PZSZY2]
  - id: M-305
    title: Split cerberus configuration.nix (llm-models, adguard, chromium policy, oci-cli overlay)
    phase: 3
    depends_on: [M-301]
    policy: pure_refactor
    hosts: [cerberus]
    registry: {add: [nixos.adguard]}
  - id: M-306
    title: host.username option; replace /home/warby literals; drop repeated allowUnfree
    phase: 3
    depends_on: [M-305, M-303, M-304]
    policy: pure_refactor
    hosts: [all]
  - id: M-307
    title: Remove vars.nix and the extra nixpkgs instances, keeping the current wallpaper
    phase: 3
    depends_on: [M-305, M-304]
    policy: pure_refactor
    hosts: [cerberus, 7PZSZY2]

  # ---------------------------------------------------------------- Phase 4
  - id: M-401
    title: pkgs/ + packagesFromDirectoryRecursive overlay; move derivations (one commit each)
    phase: 4
    depends_on: [CHECKPOINT-3]
    policy: pure_refactor
    hosts: [all]
  - id: M-402
    title: Expose perSystem.packages; curated CI build list
    phase: 4
    depends_on: [M-401]
    policy: contract_change
    hosts: []
    contract: ["packages/x86_64-linux/*", "checks/x86_64-linux/*"]
  - id: M-410
    title: Extract inline scripts with the original builders (replaceStrings placeholders)
    phase: 4
    depends_on: [CHECKPOINT-3]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]
  - id: M-430
    title: Merge the helium/vivaldi flag-file wrappers
    phase: 4
    depends_on: [M-410]
    policy: pure_refactor
    hosts: [cerberus, lacie, kali-vm]

  # ---------------------------------------------------------------- Phase 5
  - id: M-501
    title: Delete the dead bars (ricelin, hyprpanel, caelestia)
    phase: 5
    # Pulled forward to Phase 2: bars/default.nix still imports the dead bars,
    # so they must be gone before M-209 converts the bars module.
    depends_on: [M-208]
    policy: pure_refactor
    hosts: [all]
  - id: M-502
    title: Delete orphans (.config/, backup.ab, .codex, unused themes, stubs, gnomeKeyring)
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: contract_change
    hosts: [all]
    registry: {remove: [nixos.gnomeKeyring]}
  - id: M-503
    title: Remove the unused thorium input
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: contract_change
    hosts: [all]
  - id: M-504
    title: Drop `franky` from trusted-users and the stale garnix key
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: behavior_change
    hosts: [all]
    allowed_changes: ["*:nixSettings/*", "*:etc/nix/nix.conf/*", "*:B/*"]
  - id: M-505
    title: Choose the wallpaper (user decision)
    phase: 5
    depends_on: [M-307]
    policy: behavior_change
    hosts: [cerberus]
    human_approval: wallpaper choice
  - id: M-506
    title: Trim noctalia settings to non-defaults (effective settings unchanged)
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: behavior_change
    hosts: [cerberus, lacie, kali-vm]
  - id: M-507
    title: Deduplicate package lists (identity-per-profile evidence)
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: behavior_change
    hosts: [cerberus, lacie, kali-vm]
  - id: M-508
    title: nix.settings merge, statix W20, pkgs.system, helium.defaultPackage, narrow `with`
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: pure_refactor
    hosts: [all]
  - id: M-509
    title: Kali assets via fetchFromGitLab
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: behavior_change
    hosts: [lacie, kali-vm]
  - id: M-510
    title: "Tooling: statix gating, default devShell, git-hooks, gitleaks, beads cleanup, gitignore"
    phase: 5
    depends_on: [CHECKPOINT-4]
    policy: contract_change
    hosts: []
  - id: M-511
    title: Remove tombstone/changelog comments; fix stale path comments
    phase: 5
    depends_on: [M-501, M-502]
    policy: pure_refactor
    hosts: [all]
  - id: M-512
    title: Docs (README, CLAUDE.md, CONTRIBUTING, docs/cluster, .claude/commands)
    phase: 5
    depends_on: [M-511]
    policy: pure_refactor
    hosts: []
  - id: M-513
    title: Delete what remains of modules/_features/ and forbid it
    phase: 5
    depends_on: [M-501, M-502, M-511]
    policy: pure_refactor
    hosts: [all]

  # ---------------------------------------------------------------- Phase 6
  - id: M-601
    title: Split windows-kit (security gate S-1 before first push)
    phase: 6
    depends_on: [CHECKPOINT-5]
    policy: repo_move
    allow_frozen: true
    human_approval: create/push remote
  - id: M-602a
    title: Ownership pass for frozen infra modules (docs/migration/ownership.json)
    phase: 6
    depends_on: [CHECKPOINT-5]
    policy: pure_refactor
    hosts: []
  - id: M-602b
    title: Split nebula-infra; cerberus consumes its nixosModules
    phase: 6
    depends_on: [M-602a]
    policy: repo_move
    allow_frozen: true
    hosts: [all]
    human_approval: create/push remote, CI access to private inputs

  # ------------------------------------------------- harness maintenance
  # Edits to the harness change its own package. They are judged as contract
  # changes on that output; their correctness comes from re-running selftest.sh.
  - id: M-105
    title: Harness comment path after the modules/flake move
    phase: 1
    depends_on: [M-101]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh]
  - id: M-106
    title: "Harness: declared path_imports_allow per task"
    phase: 1
    depends_on: [M-105]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh, docs/migration/README.md]
  - id: M-107
    title: "Harness: inventory follows directory imports and propagates NixOS/HM class"
    phase: 1
    depends_on: [M-106]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh]
  - id: M-108
    title: "Harness: path-import metric counts module references only"
    phase: 1
    depends_on: [M-107]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh]

  # ---------------------------------------------------------------- checkpoints
  # verify --hosts all against the previous phase tag. The contract is the union
  # of that phase's declared output changes; B and C must otherwise be identical.
  - id: CHECKPOINT-1
    title: Phase 1 checkpoint (against migration/phase-0)
    phase: 1
    depends_on: [M-104, M-105, M-106, M-107, M-108]
    policy: contract_change
    hosts: [all]
    contract: [checks/x86_64-linux/module-registry, packages/x86_64-linux/migration]
    # Carried from the phase's tasks: M-101's frozen-path import fix and
    # M-102's colmena import (+1).
    allow_frozen: true
    path_imports_allow: 1
  - id: M-109
    title: "Harness: pass large diffs to jq through files (ARG_MAX)"
    phase: 2
    depends_on: [M-108]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh]
  - id: M-110
    title: "Harness: content equivalence for drv changes with no config change; store-hash-normalized layer C"
    phase: 2
    depends_on: [M-109]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/*, modules/flake/migration.nix, docs/migration/order-insensitive.txt, docs/migration/README.md]
  - id: M-111
    title: "Harness: nixosModules/homeManagerModules aliases follow their registry namespace"
    phase: 2
    depends_on: [M-110]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/migration.sh]
  - id: M-112
    title: "Harness: kv/bootspec normalization for kernel parameters (sets only when keys are unique)"
    phase: 2
    depends_on: [M-111]
    policy: contract_change
    hosts: [kali-vm]
    contract: [packages/x86_64-linux/migration]
    touches: [scripts/migration/drv-equiv.sh, docs/migration/order-insensitive.txt]
  - id: M-220b
    title: "Monitor option descriptions; mkIf c true -> c for noctalia"
    phase: 2
    depends_on: [M-220]
    policy: pure_refactor
    hosts: [all]
  - id: CHECKPOINT-2
    title: Phase 2 checkpoint (against migration/phase-1)
    phase: 2
    depends_on: [M-201, M-202, M-203, M-204, M-205, M-206, M-207, M-208, M-209, M-210, M-211, M-212, M-213, M-214, M-215, M-216, M-217, M-218, M-220, M-220b, M-501, M-109, M-110, M-111, M-112]
    policy: contract_change
