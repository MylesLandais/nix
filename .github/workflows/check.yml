name: nix flake check

on:
  push:
    branches: [dev, stable, dendritic]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Checks are cheap by design: host-<name> only records the toplevel drvPath
      # (full evaluation, no closure build). Full closures are packages.<system>.host-*,
      # built explicitly, never by flake check. Not --no-build: evaluating the
      # hosts needs import-from-derivation (e.g. tokyonight.nix) to be realised.
      - name: nix flake check (x86_64-linux checks, incl. treefmt + host eval)
        run: nix flake check --accept-flake-config --show-trace
      - name: evaluate aarch64 hosts (eval only, not buildable here)
        run: |
          for h in stage-edge stage-db; do
            nix eval --accept-flake-config --raw ".#nixosConfigurations.$h.config.system.build.toplevel.drvPath"; echo
          done
