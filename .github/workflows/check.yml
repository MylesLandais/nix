name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    # Weekly, so the cache stays warm for the paths Cerberus actually pulls.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Module layout
        run: python3 scripts/ci/check-layout.py --final
      - name: Repository tests
        run: python3 -m unittest discover -s tests
      - name: Formatting (nixfmt, deadnix, statix)
        run: nix fmt -- --ci

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Not --no-build: evaluation imports from a derivation (Home Manager), and
      # the checks themselves are tiny (drvPath file, registry diff, treefmt).
      - name: Evaluate the flake and the module registry
        run: nix flake check --show-trace
      - name: Published host constructors
        run: bash scripts/ci/test-host-builders.sh
      - name: Cerberus evaluates
        run: nix eval --raw .#nixosConfigurations.cerberus.config.system.build.toplevel.drvPath

  build:
    # Free runners build what the public caches don't have (custom packages,
    # overrides, unfree) and push it to Cachix, which Cerberus substitutes from.
    if: github.event_name != 'pull_request'
    needs: [lint, eval]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
        with:
          hatchet-protocol: rampage
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # The same caches Cerberus uses (modules/aspects/system/nix-config.nix
          # and the chaotic module), so CI only builds what Cerberus would.
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://zed.cachix.org https://noctalia.cachix.org https://cache.numtide.com https://nyx-cache.chaotic.cx
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= zed.cachix.org-1:/pHQ6dpMsAZk2DiP4WCL0p9YDNKWj2Q5FL20bNmw1cU= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cerberus-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Daemon mode pushes only what this job builds. Skip sources and the
          # vendor download, which are cheap to refetch and eat the 5 GB quota.
          pushFilter: "(-source$|\\.tar\\.(gz|xz|zst)$|\\.deb$|\\.zip$)"
      - name: Build packages and the Cerberus closure
        run: bash scripts/ci/build-closure.sh
      - name: Store usage
        if: always()
        run: df -h /nix
